[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-tty"
version = "0.0.0"
description = "PTY 与子进程会话的守护进程核心"
requires-python = ">=3.11"
dependencies = [
    # localpty 后端的终端模型
    "pyte>=0.8",
    # 屏幕位图。Tk 的 PhotoImage 只吃位图、没有 SVG 解码器；resvg-py 自带渲染器，
    # 不依赖系统装 cairo 之类的原生库。
    "resvg-py>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# vendor 与运行时一致地接进 sys.path（见 core/runtime/vendor.py），否则测试导入不到
# vendor 下的模块
pythonpath = ["src", "vendor"]
testpaths = ["tests"]
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py311"
# vendor/ 下只有 pywezterm 是第三方产物；condrv / openpty 是自研模块，照常检查
extend-exclude = ["vendor/pywezterm"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = [
    # 宿主与界面边界有意兜住所有异常：第三方原生扩展、平台 API、UI 回调抛什么
    # 都不该炸穿会话生命周期。这些位置都在 except 里做了日志或用户提示。
    "BLE001",
    # 全角标点在中文注释/文档字符串里是刻意的写法
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["agentic_tty"]
